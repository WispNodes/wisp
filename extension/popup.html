<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root{--bg:#07080a;--panel:#0c0e12;--fg:#e9edf2;--dim:#8b94a1;--faint:#5a626e;--line:#191d24;--grn:#76b900;--grn2:#8fd400;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;width:360px;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px}
.wrap{padding:16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top img{width:24px;height:24px}
.top b{font-weight:800;letter-spacing:.12em;font-size:14px}
.pill{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--dim);
  border:1px solid var(--line);border-radius:100px;padding:5px 11px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--grn);box-shadow:0 0 8px var(--grn);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
input{width:100%;font-family:var(--mono);font-size:13px;padding:10px 11px;border-radius:9px;border:1px solid var(--line);background:#050607;color:var(--fg);outline:none}
input:focus{border-color:var(--faint)}
/* status card */
.card{border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(118,185,0,.05),rgba(255,255,255,.012))}
.card .rowt{display:flex;justify-content:space-between;align-items:center}
.card .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.card .big{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--grn2);margin-top:4px}
.card .sub{font-size:11.5px;color:var(--dim);margin-top:2px}
.stream{display:flex;gap:4px;height:12px;align-items:center;opacity:.35}
.stream.on{opacity:1}
.stream i{width:6px;height:2px;border-radius:2px;background:var(--grn2);box-shadow:0 0 6px var(--grn);animation:flow 1.2s linear infinite}
.stream i:nth-child(2){animation-delay:.2s}.stream i:nth-child(3){animation-delay:.4s}.stream i:nth-child(4){animation-delay:.6s}.stream i:nth-child(5){animation-delay:.8s}
@keyframes flow{0%,100%{transform:scaleX(.5);opacity:.3}50%{transform:scaleX(1.6);opacity:1}}
/* stat grid */
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.tile .l{font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.tile .v{font-family:var(--mono);font-size:15px;font-weight:700;margin-top:4px}
.tile .v.g{color:var(--grn2)}
.btn{width:100%;font-family:var(--sans);font-weight:700;font-size:14px;padding:12px;border-radius:11px;border:1px solid var(--grn);
  background:var(--grn);color:#0a0f00;cursor:pointer;transition:.15s;margin-top:14px}
.btn:hover{background:var(--grn2);border-color:var(--grn2)}
.btn.off{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.off:hover{border-color:var(--faint)}
.msg{font-size:11.5px;color:var(--grn2);min-height:15px;margin-top:8px;text-align:center}
.msg.err{color:#e88}
.ref{display:flex;gap:8px;margin-top:12px}
.ref input{font-size:11px;padding:8px 10px}
.ref button{flex:0 0 auto;font-family:var(--sans);font-weight:600;font-size:12px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.ref button:hover{border-color:var(--faint)}
.foot{font-size:11px;color:var(--faint);margin-top:12px;line-height:1.5;text-align:center}
.foot a{color:var(--grn2);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="icons/48.png" alt="WISP"><b>WISP</b>
    <div class="pill"><span class="dot" id="dot"></span><span id="ststr">offline</span></div>
  </div>

  <label>Your Robinhood Chain wallet</label>
  <input id="wallet" placeholder="0x… (rewards accrue here)" spellcheck="false">

  <div class="card">
    <div class="rowt">
      <div>
        <div class="lbl">NVDA accrued</div>
        <div class="big" id="nvda">0.0000</div>
        <div class="sub" id="csub">connect wallet · offline</div>
      </div>
      <div class="stream" id="stream"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </div>

  <div class="grid">
    <div class="tile"><div class="l">Shared</div><div class="v" id="gb">0 B</div></div>
    <div class="tile"><div class="l">Points</div><div class="v g" id="pts">0</div></div>
    <div class="tile"><div class="l">Share</div><div class="v g" id="share">0%</div></div>
    <div class="tile"><div class="l">Sessions</div><div class="v" id="jobs">0</div></div>
    <div class="tile"><div class="l">Region</div><div class="v" id="geo">—</div></div>
    <div class="tile"><div class="l">Uptime</div><div class="v" id="up">—</div></div>
  </div>

  <button class="btn off" id="toggle">Start sharing</button>
  <div class="msg" id="msg"></div>

  <label style="margin-top:14px">Refer &amp; earn — 20% / 10% / 5%</label>
  <div class="ref">
    <input id="reflink" readonly value="connect wallet for link">
    <button id="copy">Copy</button>
  </div>

  <div class="foot">
    Bandwidth only — never your tabs or files. Hold 250,000 $WISP to earn.
    Claim on the <a href="https://wispnodes.net/dashboard" target="_blank">dashboard</a>.
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
